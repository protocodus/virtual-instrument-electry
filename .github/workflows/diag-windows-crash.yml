# TEMPORARY DIAGNOSTIC (not for merge): capture the stack of the intermittent
# Electry.PluginProcessor segfault on windows-2025.
name: Diagnose Windows processor crash

on:
  push:
    branches: [claude_personal/upbeat-shannon-49pqqb]

permissions:
  contents: read

jobs:
  windows-processor-crash:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The Main build's Windows configuration, plus PDBs for symbolised stacks.
      - name: Configure
        run: >
          cmake -S . -B build-win -A x64 -DELECTRY_BUILD_PLUGIN=ON
          -DELECTRY_BUILD_CLAP=ON -DBUILD_TESTING=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi"
          "-DCMAKE_C_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi"
          "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432 /DEBUG /OPT:REF /OPT:ICF"

      - name: Build processor tests
        run: cmake --build build-win --config Release --parallel --target ElectryPluginProcessorTests

      - name: Run until it crashes
        shell: pwsh
        run: |
          $exe = "build-win/Release/ElectryPluginProcessorTests.exe"
          $crashes = 0
          for ($run = 1; $run -le 16 -and $crashes -lt 4; $run++) {
            Write-Host "===== run $run"
            $started = Get-Date
            & $exe 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
            Write-Host ("===== run {0} exit 0x{1:X8} after {2:N1}s" -f $run, $code, ((Get-Date) - $started).TotalSeconds)
            if ($code -ne 0) { $crashes++ }
          }
          Write-Host "===== crashes: $crashes"

      - name: Windows Error Reporting events
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001 } -MaxEvents 8 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Id, Message
