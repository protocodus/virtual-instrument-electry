name: Main build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: # allow manual runs from the Actions tab

# Refresh distribution packages and their screenshot/audio previews together.
permissions:
  contents: read

# Each push builds independently: a shared concurrency group would discard
# pending builds when several merges arrive while another run is still active.

jobs:
  # Linux is the canonical demo renderer. Keep the whole rendered set in the
  # run even when a newer source commit makes this run too old to update main.
  refresh-audio-demos:
    name: Render audio demos and README peak table
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Render and verify all 23 audio demos
        run: |
          set -euo pipefail
          cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=OFF -DBUILD_TESTING=OFF
          cmake --build build-dsp --parallel --target ElectryRenderDemos
          ./build-dsp/ElectryRenderDemos Docs/audio
          rendered=$(find Docs/audio -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 23 )); then
            echo "error: rendered $rendered demo WAVs, expected 23" >&2
            exit 1
          fi
          # Only canonical demos belong in this payload; frozen listening and
          # per-fix previews in subdirectories remain outside the refresh.
          tar -czf build-dsp/audio-demos.tar.gz README.md Docs/audio/*.wav

      - name: Upload audio demos and generated README
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-build-audio
          path: build-dsp/audio-demos.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-macos:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: macOS universal (VST3, AU, CLAP, standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Build-time FetchContent code must not inherit the write credential.
          persist-credentials: false

      # Removing the committed image first is what makes the check after the
      # build meaningful: the file can only be there afterwards because this
      # run's suite rendered it, so a suite that quietly stopped writing its
      # snapshot fails the build instead of republishing a stale editor.
      - name: Clear the committed screenshot before rendering
        run: rm -f Docs/screenshots/electry-standalone.png

      # Full arm64 + x86_64 universal build (script default) plus the project's
      # tests. The suite renders the committed editor screenshot while it runs,
      # so the image in the README tracks the real editor.
      - name: Build and run tests
        run: |
          set -euo pipefail
          export "ELECTRY_EDITOR_SNAPSHOT=${GITHUB_WORKSPACE}/Docs/screenshots/electry-standalone.png"
          ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: |
          set -euo pipefail
          screenshot="Docs/screenshots/electry-standalone.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: the suite did not render $screenshot" >&2
            echo "The suite must honour ELECTRY_EDITOR_SNAPSHOT." >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          # The signature alone only proves the write started: a PNG truncated
          # part way through still carries it. Every PNG ends with a zero-length
          # IEND chunk and its constant CRC, so the trailer is what proves the
          # encoder ran to completion and a whole image landed.
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

      # Uploaded before packaging so that a packaging failure cannot cost the
      # run the screenshot it has already rendered, and handed to the commit job
      # rather than committed here.
      #
      # It stays gated on the suite passing, and deliberately so. The processor
      # suite counts its failures rather than stopping at the first one, so a run
      # whose editor assertions failed -- a blank render, buttons that overlap, a
      # control strip that lost its buttons -- still writes the PNG before
      # reporting the failure. Publishing that image is the one outcome worse
      # than leaving yesterday's in place.
      - name: Upload the rendered screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-build-screenshot
          path: Docs/screenshots/electry-standalone.png
          if-no-files-found: error
          retention-days: 14

      - name: Package (ad-hoc-signed bundles)
        run: |
          set -euo pipefail
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-macos/CMakeCache.txt)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "error: invalid CMake project version: ${version:-missing}" >&2
            exit 1
          fi
          VERSION="$version" ./scripts/sign-and-package-macos.sh

      - name: Check that both distributable packages were produced
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(
            build-macos/dist/Electry-*-macOS-universal.zip
            build-macos/dist/Electry-*-macOS-universal.pkg
          )
          if (( ${#packages[@]} != 2 )); then
            echo "error: expected one zip and one pkg, found ${#packages[@]}" >&2
            printf '  %s\n' "${packages[@]:-(none)}" >&2
            exit 1
          fi
          printf 'Packaged %s\n' "${packages[@]}"

      # Handed to the aggregate artifact job as one complete cross-platform set.
      - name: Upload the distributable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages-macos
          path: |
            build-macos/dist/Electry-*-macOS-universal.zip
            build-macos/dist/Electry-*-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 1

  build-linux:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Linux build and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=ON \
            -DBUILD_TESTING=OFF

      - name: Build VST3, CLAP and standalone
        run: |
          cmake --build build-linux --parallel \
            --target Electry_VST3 Electry_CLAP Electry_Standalone

      - name: Package (Linux x64 tarball)
        run: |
          set -euo pipefail
          artefacts="build-linux/Electry_artefacts/Release"
          test -d "$artefacts/VST3/Electry.vst3"
          test -s "$artefacts/CLAP/Electry.clap"
          test -x "$artefacts/Standalone/Electry"
          dist="build-linux/dist"
          mkdir -p "$dist"
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-linux/CMakeCache.txt)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "error: invalid CMake project version: ${version:-missing}" >&2
            exit 1
          fi
          archive="$dist/Electry-${version}-Linux-x64.tar.gz"
          # Licence and notice files ship inside the binary archive (the MIT
          # licence requires the notice to accompany binaries).
          contents=("VST3/Electry.vst3" "CLAP/Electry.clap" "Standalone/Electry")
          for notice in LICENSE THIRD_PARTY_NOTICES.md ThirdParty/*-LICENSE.md; do
            test -s "$notice"
            cp "$notice" "$artefacts/$(basename "$notice")"
            contents+=("$(basename "$notice")")
          done
          tar -czf "$archive" -C "$artefacts" "${contents[@]}"
          test -s "$archive"
          tar -tzf "$archive" >/dev/null

      - name: Upload the distributable Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages-linux
          path: build-linux/dist/Electry-*-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Windows x64 (VST3, CLAP, standalone)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure
        # Embed the Release C++ runtime in every target, including dependencies.
        run: |
          cmake -S . -B build-win -A x64 -DELECTRY_BUILD_PLUGIN=ON -DELECTRY_BUILD_CLAP=ON -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build VST3, CLAP and standalone and run tests
        run: |
          cmake --build build-win --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-win -C Release --output-on-failure

      - name: Package (Windows x64 ZIP)
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir build-win

      - name: Upload the distributable Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages-win
          path: build-win/dist/Electry-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  # Keep one complete package set on the workflow run. A mutable rolling GitHub
  # release is deliberately not used: repository release immutability protects
  # commercial tags and assets, while development builds remain short-lived.
  collect-packages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Collect packages, screenshot and audio demos
    needs: [build-macos, build-linux, build-windows, refresh-audio-demos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download every package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: distribution-packages-*
          merge-multiple: true
          path: dist

      - name: Check the four-file manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Deliberately expand this glob so the array contains every match.
          # shellcheck disable=SC2206
          mac_zips=(dist/Electry-*-macOS-universal.zip)
          if (( ${#mac_zips[@]} != 1 )); then
            echo "error: expected exactly one macOS zip, found ${#mac_zips[@]}" >&2
            printf '  %s\n' "${mac_zips[@]:-(none)}" >&2
            exit 1
          fi
          filename="${mac_zips[0]##*/}"
          version="${filename#Electry-}"
          version="${version%-macOS-universal.zip}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "error: invalid version in $filename" >&2
            exit 1
          fi
          expected=(
            "dist/Electry-${version}-macOS-universal.zip"
            "dist/Electry-${version}-macOS-universal.pkg"
            "dist/Electry-${version}-Linux-x64.tar.gz"
            "dist/Electry-${version}-Windows-x64.zip"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "error: missing, empty, or version-mismatched asset: $asset" >&2
              exit 1
            fi
          done
          assets=(dist/*)
          if (( ${#assets[@]} != 4 )); then
            echo "error: expected exactly four release assets, found ${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]:-(none)}" >&2
            exit 1
          fi
          printf 'Release asset: %s\n' "${assets[@]}"

      - name: Download the rendered audio demos
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-build-audio
          path: rendered-audio

      - name: Unpack the audio demos and generated README
        run: |
          mkdir -p dist/media
          tar -xzf rendered-audio/audio-demos.tar.gz -C dist/media

      - name: Download the rendered screenshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-build-screenshot
          path: dist/media/Docs/screenshots

      - name: Record checksums and source commit for the complete build
        working-directory: dist
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SOURCE_COMMIT" > SOURCE_COMMIT.txt
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      # Retained on the workflow run itself, downloadable by anyone with repo
      # access, as one complete cross-platform set.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electry-main-build
          path: dist
          if-no-files-found: error
          retention-days: 14

  # A single writer updates both media sets only after every product was built.
  # All generation happens in read-only jobs; only this publication job can push.
  refresh-generated-media:
    if: github.ref == 'refs/heads/main'
    name: Refresh screenshot, audio demos and README together
    needs: collect-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the complete build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: electry-main-build
          path: completed-build

      - name: Verify the downloaded build
        working-directory: completed-build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(cat SOURCE_COMMIT.txt)" = "$SOURCE_COMMIT"
          sha256sum --check SHA256SUMS.txt

      - name: Commit changed media from this source version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/refresh-generated-media.py \
            --source-commit "$GITHUB_SHA" \
            --media-dir "$GITHUB_WORKSPACE/completed-build/media" \
            --remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --branch main
