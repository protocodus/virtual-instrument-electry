name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede outdated PR checks, but keep every main push's build.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sanitizer-fuzz:
    name: Address/UB sanitizers and stateful input fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build pkg-config xvfb xauth \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev
      - name: Configure instrumented DSP and processor tests
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DELECTRY_ENABLE_SANITIZERS=ON -DELECTRY_BUILD_FUZZER=ON \
            -DELECTRY_BUILD_CLAP=OFF -DELECTRY_BUILD_TOOLS=OFF
          cmake --build build-sanitize --parallel 2 --target \
            ElectryEngineTests ElectryFxTests ElectryPluginProcessorTests ElectryDspFuzz
      - name: Run regression and hostile-input suites
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          xvfb-run -a ctest --test-dir build-sanitize --output-on-failure \
            -R '^Electry\.(ElectryEngine|ElectryFx|PluginProcessor)$'
      - name: Mutate DSP API sequences
        run: |
          mkdir -p build-sanitize/corpus build-sanitize/fuzz-artifacts
          python3 - <<'PY'
          import pathlib, random
          corpus = pathlib.Path('build-sanitize/corpus')
          rng = random.Random(0xE1EC7)
          for index in range(32):
              # Seed ordinary notes as well as raw parameter/controller bytes.
              prefix = bytes([index % 12, 128, 2, 72, 7, 255, 0, 31])
              (corpus / str(index)).write_bytes(prefix + rng.randbytes(512))
          PY
          build-sanitize/ElectryDspFuzz build-sanitize/corpus \
            -seed=20260914 -max_total_time=120 -max_len=4096 \
            -timeout=30 -rss_limit_mb=2048 \
            -artifact_prefix=build-sanitize/fuzz-artifacts/
      - name: Preserve fuzz reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-fuzz-corpus
          path: |
            build-sanitize/corpus
            build-sanitize/fuzz-artifacts
            build-sanitize/Testing/Temporary/LastTest.log
          retention-days: 7

  dsp-tests:
    name: DSP tests (JUCE-free, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-dsp \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=OFF \
            -DBUILD_TESTING=ON

      - name: Build and test DSP engine
        run: |
          cmake --build build-dsp --parallel
          ctest --test-dir build-dsp --output-on-failure

      - name: Validate C++17 embedded instrument
        run: |
          cmake -S . -B build-embedded -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=OFF -DELECTRY_BUILD_TOOLS=OFF \
            -DELECTRY_EMBEDDED_TARGET=ON
          cmake --build build-embedded --parallel \
            --target ElectryPerformerTests ElectryFxTests
          ctest --test-dir build-embedded --output-on-failure \
            -R '^Electry\.(Performer|ElectryFx)$'

      # The count is the point of the check: it is what turns "the renderer ran"
      # into "the renderer rendered the whole set", so a take that silently
      # stopped being written fails CI instead of leaving a stale WAV committed
      # forever. Adding or removing a take means updating the number here in the
      # same change.
      - name: Render and verify demo audio
        run: |
          set -euo pipefail
          cmake --build build-dsp --target ElectryRenderDemos --parallel
          ./build-dsp/ElectryRenderDemos Docs/audio
          rendered=$(find Docs/audio -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 23 )); then
            echo "error: rendered $rendered demo WAVs, expected 23" >&2
            exit 1
          fi
          echo "Electry: rendered all $rendered demo WAVs"

      - name: Configure Linux plug-in build
        run: |
          cmake \
            -S . \
            -B build-dsp \
            -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=ON \
            -DELECTRY_BUILD_CLAP=ON \
            -DBUILD_TESTING=ON

      - name: Build Linux VST3, CLAP and standalone
        run: |
          cmake --build build-dsp --parallel \
            --target Electry_VST3 Electry_CLAP Electry_Standalone \
              ElectryPluginProcessorTests ElectryVST3ArtifactSmokeTests \
              ElectryCLAPArtifactSmokeTests

      - name: Validate Linux plug-ins and processor
        run: |
          xvfb-run -a ctest --test-dir build-dsp --output-on-failure \
            -R '^Electry\.(PluginProcessor|(VST3|CLAP)Artifact)$'

      - name: Package Linux VST3, CLAP and standalone
        run: |
          set -euo pipefail
          artefacts="build-dsp/Electry_artefacts/Release"
          test -d "$artefacts/VST3/Electry.vst3"
          test -s "$artefacts/CLAP/Electry.clap"
          test -x "$artefacts/Standalone/Electry"
          dist="build-dsp/dist"
          mkdir -p "$dist"
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-dsp/CMakeCache.txt)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "error: invalid CMake project version: ${version:-missing}" >&2
            exit 1
          fi
          archive="$dist/Electry-${version}-build-${GITHUB_RUN_NUMBER}-Linux-x64.tar.gz"
          # Licence and notice files ship inside the binary archive (the MIT
          # licence requires the notice to accompany binaries).
          contents=("VST3/Electry.vst3" "CLAP/Electry.clap" "Standalone/Electry")
          for notice in LICENSE THIRD_PARTY_NOTICES.md ThirdParty/*-LICENSE.md; do
            test -s "$notice"
            cp "$notice" "$artefacts/$(basename "$notice")"
            contents+=("$(basename "$notice")")
          done
          tar -czf "$archive" -C "$artefacts" "${contents[@]}"
          test -s "$archive"
          tar -tzf "$archive" >/dev/null

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux
          path: build-dsp/dist/Electry-*-build-*-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  plugin-macos:
    name: Plug-in build (macOS native arch)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Clearing the committed screenshot first is what makes the check after
      # the build meaningful: the file can only be there afterwards because this
      # run's suite rendered it.
      - name: Clear screenshot before rendering
        run: rm -f Docs/screenshots/electry-standalone.png

      # Native-arch only keeps CI fast; the distribution workflow builds the
      # full arm64 + x86_64 universal binaries. Uses the same build script
      # developers run locally, and runs the project's tests.
      - name: Build plug-in and run tests
        env:
          BUILD_UNIVERSAL: "OFF"
          ELECTRY_EDITOR_SNAPSHOT: "${{ github.workspace }}/Docs/screenshots/electry-standalone.png"
        run: ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: |
          set -euo pipefail
          screenshot="Docs/screenshots/electry-standalone.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: the suite did not render $screenshot" >&2
            echo "The suite must honour ELECTRY_EDITOR_SNAPSHOT." >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

  dsp-tests-windows:
    name: DSP tests (JUCE-free, Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure DSP tests
        # Embed the Release C++ runtime so the ZIP works without a separate
        # Visual C++ redistributable installation.
        run: |
          cmake -S . -B build-win -A x64 -DELECTRY_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build and test DSP engine
        run: |
          cmake --build build-win --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-win -C Release --output-on-failure

      - name: Configure Windows plug-in build
        run: |
          cmake -S . -B build-win -DELECTRY_BUILD_PLUGIN=ON -DELECTRY_BUILD_CLAP=ON -DBUILD_TESTING=ON

      - name: Build Windows VST3, CLAP and standalone and run tests
        run: |
          cmake --build build-win --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-win -C Release --output-on-failure -R '^Electry\.(PluginProcessor|(VST3|CLAP)Artifact)$'

      - name: Package Windows VST3, CLAP and standalone
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir build-win

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows
          path: build-win/dist/Electry-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
