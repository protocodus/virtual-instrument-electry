name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede outdated PR checks, but keep every main push's build.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests and Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements-review.txt

      - name: Install listening and analysis test dependencies
        run: python -m pip install -r Tools/requirements-review.txt

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure DSP build
        run: |
          cmake -S . -B build-dsp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=OFF \
            -DBUILD_TESTING=ON

      - name: Build and run unit and audio tiers
        run: |
          cmake --build build-dsp --parallel
          ctest --test-dir build-dsp --output-on-failure --no-tests=error -L unit
          ctest --test-dir build-dsp --output-on-failure --no-tests=error -L audio

      - name: Validate C++17 embedded instrument
        run: |
          cmake -S . -B build-embedded -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=OFF -DELECTRY_BUILD_TOOLS=OFF \
            -DELECTRY_EMBEDDED_TARGET=ON
          cmake --build build-embedded --parallel \
            --target ElectryPerformerTests ElectryFxTests
          ctest --test-dir build-embedded --output-on-failure \
            -R '^Electry\.(Performer|ElectryFx)$'

      # The count is the point of the check: it is what turns "the renderer ran"
      # into "the renderer rendered the whole set", so a take that silently
      # stopped being written fails CI instead of leaving a stale WAV committed
      # forever. Adding or removing a take means updating the number here in the
      # same change.
      - name: Render and verify demo audio
        run: |
          set -euo pipefail
          ./build-dsp/ElectryRenderDemos Docs/audio
          rendered=$(find Docs/audio -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 23 )); then
            echo "error: rendered $rendered demo WAVs, expected 23" >&2
            exit 1
          fi
          echo "Electry: rendered all $rendered demo WAVs"

      - name: Upload demo audio
        uses: actions/upload-artifact@v4
        with:
          name: ci-audio-demos
          path: |
            README.md
            Docs/audio/*.wav
          if-no-files-found: error
          retention-days: 7

      - name: Configure Linux plug-in build
        run: |
          cmake -S . -B build-plugin -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=ON \
            -DELECTRY_BUILD_CLAP=ON \
            -DBUILD_TESTING=ON

      - name: Build Linux VST3, CLAP and standalone
        run: |
          cmake --build build-plugin --parallel \
            --target Electry_VST3 Electry_CLAP Electry_Standalone \
              ElectryPluginProcessorTests ElectryVST3ArtifactSmokeTests \
              ElectryCLAPArtifactSmokeTests RenderElectryPresetDemos

      - name: Validate Linux plug-ins and processor
        run: |
          xvfb-run -a ctest --test-dir build-plugin --output-on-failure \
            --no-tests=error -L unit -R '^Electry\.(PluginProcessor|(VST3|CLAP)Artifact)$'

      - name: Render every factory rig demo twice and compare bits
        run: |
          xvfb-run -a ctest --test-dir build-plugin --output-on-failure \
            --no-tests=error -L audio -R '^Electry\.AudioDemos$'

      - name: Package Linux VST3, CLAP and standalone
        run: python3 scripts/package-linux.py --build-dir build-plugin

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux
          path: build-plugin/dist/Electry-*-build.*-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  plugin-macos:
    name: Plug-in build and package (macOS universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements-review.txt

      - name: Install listening and analysis test dependencies
        run: python -m pip install -r Tools/requirements-review.txt

      # Clearing the committed screenshot first is what makes the check after
      # the build meaningful: the file can only be there afterwards because this
      # run's suite rendered it.
      - name: Clear screenshot before rendering
        run: rm -f Docs/screenshots/electry.png

      # The same script developers run locally: a universal build plus every
      # test tier, including the render tier that writes the screenshot.
      - name: Build plug-in and run tests
        run: ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: test -s Docs/screenshots/electry.png

      - name: Upload the rendered screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ci-screenshot
          path: Docs/screenshots/electry.png
          if-no-files-found: error
          retention-days: 7

      - name: Package (ad-hoc-signed bundles)
        run: ./scripts/sign-and-package-macos.sh

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: ci-macos
          path: |
            build-macos/dist/Electry-*-build.*-macOS-universal.zip
            build-macos/dist/Electry-*-build.*-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 7

  dsp-tests-windows:
    name: DSP tests and Windows package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/requirements-review.txt

      - name: Install listening and analysis test dependencies
        run: python -m pip install -r Tools/requirements-review.txt

      # Embed the Release C++ runtime so the ZIP works without a separate
      # Visual C++ redistributable installation.
      - name: Configure DSP build
        run: |
          cmake -S . -B build-dsp -A x64 -DELECTRY_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build and run the unit tier
        run: |
          cmake --build build-dsp --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-dsp -C Release --output-on-failure --no-tests=error -L unit

      - name: Configure Windows plug-in build
        run: |
          cmake -S . -B build-plugin -A x64 -DELECTRY_BUILD_PLUGIN=ON -DELECTRY_BUILD_CLAP=ON -DELECTRY_BUILD_TOOLS=OFF -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build Windows VST3, CLAP and standalone and run plug-in tests
        run: |
          cmake --build build-plugin --config Release --parallel --target Electry_VST3 Electry_CLAP Electry_Standalone ElectryPluginProcessorTests ElectryVST3ArtifactSmokeTests ElectryCLAPArtifactSmokeTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-plugin -C Release --output-on-failure --no-tests=error -L unit -R '^Electry\.(PluginProcessor|(VST3|CLAP)Artifact)$'

      - name: Package Windows VST3, CLAP and standalone
        run: python scripts/package-windows.py --build-dir build-plugin

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows
          path: build-plugin/dist/Electry-*-build.*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  sanitizers:
    name: Address/UB sanitizers, fuzzing and C++17 Rack build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compiler and host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build pkg-config xvfb xauth \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev
      - name: Build the Rack's C++17 sources with its flags
        run: |
          cmake -S . -B build-cxx17 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DELECTRY_BUILD_PLUGIN=OFF -DELECTRY_BUILD_TOOLS=OFF -DBUILD_TESTING=OFF
          cmake --build build-cxx17 --parallel 2 --target ElectryDSPCxx17
      - name: Configure instrumented DSP and processor tests
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DELECTRY_ENABLE_SANITIZERS=ON -DELECTRY_BUILD_FUZZER=ON \
            -DELECTRY_BUILD_CLAP=OFF -DELECTRY_BUILD_TOOLS=OFF
          cmake --build build-sanitize --parallel 2 --target \
            ElectryEngineTests ElectryRefretTests ElectryFxTests ElectryPluginProcessorTests ElectryDspFuzz \
            ElectryParameterMatrixTests
      - name: Run unit and fuzz tiers under the sanitizers
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          xvfb-run -a ctest --test-dir build-sanitize --output-on-failure \
            --no-tests=error -L 'unit|fuzz' \
            -R '^Electry\.(ElectryEngine|ElectryFx|PluginProcessor|DspFuzz|ParameterMatrix)$'
      - name: Mutate DSP API sequences
        run: |
          mkdir -p build-sanitize/corpus build-sanitize/fuzz-artifacts
          python3 - <<'PY'
          import pathlib, random
          corpus = pathlib.Path('build-sanitize/corpus')
          rng = random.Random(0xE1EC7)
          for index in range(32):
              # Seed ordinary notes as well as raw parameter/controller bytes.
              prefix = bytes([index % 12, 128, 2, 72, 7, 255, 0, 31])
              (corpus / str(index)).write_bytes(prefix + rng.randbytes(512))
          PY
          build-sanitize/ElectryDspFuzz build-sanitize/corpus \
            -seed=20260914 -max_total_time=120 -max_len=4096 \
            -timeout=30 -rss_limit_mb=2048 \
            -artifact_prefix=build-sanitize/fuzz-artifacts/
      - name: Preserve fuzz reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizers-fuzz-corpus
          path: |
            build-sanitize/corpus
            build-sanitize/fuzz-artifacts
            build-sanitize/Testing/Temporary/LastTest.log
          retention-days: 7
