name: Main build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: # allow manual runs from the Actions tab

# Refresh distribution packages and their screenshot/audio previews together.
permissions:
  contents: read

env:
  # Build numbers continue from the retired nightly.yml workflow, whose last
  # run was build 62; renaming the workflow restarted github.run_number at 1.
  # Each job's first step sets BUILD_NUMBER from this offset.
  BUILD_NUMBER_OFFSET: 62
  # A pinned pluginval release, each archive checked against its SHA-256.
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_LINUX_SHA256: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
  PLUGINVAL_MACOS_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  PLUGINVAL_WINDOWS_SHA256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab

# Each push builds independently: a shared concurrency group would discard
# pending builds when several merges arrive while another run is still active.

jobs:
  # Linux is the canonical demo renderer. Keep the whole rendered set in the
  # run even when a newer source commit makes this run too old to update main.
  refresh-audio-demos:
    name: DSP tiers, audio demos and README peak table
    runs-on: ubuntu-24.04
    steps:
      - name: Number this build
        shell: bash
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and run the unit and audio tiers
        run: |
          set -euo pipefail
          cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build-dsp --parallel
          ctest --test-dir build-dsp --output-on-failure --no-tests=error -L 'unit|audio'

      - name: Render and verify all 23 audio demos
        run: |
          set -euo pipefail
          ./build-dsp/ElectryRenderDemos Docs/audio
          rendered=$(find Docs/audio -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 23 )); then
            echo "error: rendered $rendered demo WAVs, expected 23" >&2
            exit 1
          fi
          # Only canonical demos belong in this payload; frozen listening and
          # per-fix previews in subdirectories remain outside the refresh.
          tar -czf build-dsp/audio-demos.tar.gz README.md Docs/audio/*.wav

      - name: Upload audio demos and generated README
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-build-audio
          path: build-dsp/audio-demos.tar.gz
          if-no-files-found: error
          retention-days: 30

  # The long coverage-guided session; every PR runs a short one in ci.yml.
  long-fuzz:
    name: Long sanitized DSP fuzz run
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Number this build
        shell: bash
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the libFuzzer harness
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DELECTRY_BUILD_FUZZER=ON \
            -DELECTRY_BUILD_PLUGIN=OFF -DELECTRY_BUILD_TOOLS=OFF -DBUILD_TESTING=OFF
          cmake --build build-fuzz --parallel --target ElectryDspFuzz

      - name: Fuzz the DSP API for 30 minutes
        run: |
          mkdir -p build-fuzz/corpus build-fuzz/fuzz-artifacts
          build-fuzz/ElectryDspFuzz build-fuzz/corpus \
            -seed="$BUILD_NUMBER" -max_total_time=1800 -max_len=4096 \
            -timeout=30 -rss_limit_mb=2048 \
            -artifact_prefix=build-fuzz/fuzz-artifacts/

      - name: Preserve fuzz reproducers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: long-fuzz-${{ env.BUILD_NUMBER }}
          path: |
            build-fuzz/corpus
            build-fuzz/fuzz-artifacts
          retention-days: 30

  build-macos:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: macOS universal (VST3, AU, CLAP, standalone)
    runs-on: macos-15
    steps:
      - name: Number this build
        shell: bash
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Build-time FetchContent code must not inherit the write credential.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Removing the committed image first is what makes the check after the
      # build meaningful: the file can only be there afterwards because this
      # run's suite rendered it, so a suite that quietly stopped writing its
      # snapshot fails the build instead of republishing a stale editor.
      - name: Clear the committed screenshot before rendering
        run: rm -f Docs/screenshots/electry.png

      # Full arm64 + x86_64 universal build (script default) plus every test
      # tier. The render tier writes the committed editor screenshot, so the
      # image in the README tracks the real editor.
      - name: Build and run tests
        run: ./scripts/build-macos.sh

      # The render tier already checked the PNG; this proves it reached the
      # committed path.
      - name: Check that the editor screenshot was rendered
        run: test -s Docs/screenshots/electry.png

      # Uploaded before packaging so that a packaging failure cannot cost the
      # run the screenshot it has already rendered, and handed to the commit job
      # rather than committed here.
      #
      # It stays gated on the suite passing, and deliberately so. The processor
      # suite counts its failures rather than stopping at the first one, so a run
      # whose editor assertions failed -- a blank render, buttons that overlap, a
      # control strip that lost its buttons -- still writes the PNG before
      # reporting the failure. Publishing that image is the one outcome worse
      # than leaving yesterday's in place.
      - name: Upload the rendered screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-build-screenshot
          path: Docs/screenshots/electry.png
          if-no-files-found: error
          retention-days: 30

      - name: Validate the AU with auval
        run: |
          set -euo pipefail
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          ditto "build-macos/Electry_artefacts/Release/AU/Electry.component" "$components/Electry.component"
          # The registrar caches the component list; restarting it rescans.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -strict -v aumu Elc1 Eltr

      - name: Validate the VST3 with pluginval
        working-directory: build-macos
        run: |
          set -euo pipefail
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "${PLUGINVAL_MACOS_SHA256}  pluginval.zip" | shasum -a 256 -c -
          ditto -x -k pluginval.zip .
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --verbose \
            --validate "Electry_artefacts/Release/VST3/Electry.vst3"

      - name: Package (ad-hoc-signed bundles)
        run: ./scripts/sign-and-package-macos.sh

      - name: Check that both distributable packages were produced
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(
            build-macos/dist/Electry-*-build.*-macOS-universal.zip
            build-macos/dist/Electry-*-build.*-macOS-universal.pkg
          )
          if (( ${#packages[@]} != 2 )); then
            echo "error: expected one zip and one pkg, found ${#packages[@]}" >&2
            printf '  %s\n' "${packages[@]:-(none)}" >&2
            exit 1
          fi
          printf 'Packaged %s\n' "${packages[@]}"

      # Handed to the aggregate artifact job as one complete cross-platform set.
      - name: Upload the distributable packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages-macos
          path: |
            build-macos/dist/Electry-*-build.*-macOS-universal.zip
            build-macos/dist/Electry-*-build.*-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 1

  build-plugin:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Linux build and package
    runs-on: ubuntu-24.04
    steps:
      - name: Number this build
        shell: bash
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-plugin \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DELECTRY_BUILD_PLUGIN=ON \
            -DELECTRY_BUILD_CLAP=ON \
            -DBUILD_TESTING=ON

      - name: Build VST3, CLAP and standalone
        run: |
          cmake --build build-plugin --parallel \
            --target Electry_VST3 Electry_CLAP Electry_Standalone \
              ElectryPluginProcessorTests ElectryVST3ArtifactSmokeTests \
              ElectryCLAPArtifactSmokeTests

      - name: Validate Linux plug-ins and processor
        run: |
          xvfb-run -a ctest --test-dir build-plugin --output-on-failure \
            --no-tests=error -L unit -R '^Electry\.(PluginProcessor|(VST3|CLAP)Artifact)$'

      - name: Validate the VST3 with pluginval
        working-directory: build-plugin
        run: |
          set -euo pipefail
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          echo "${PLUGINVAL_LINUX_SHA256}  pluginval.zip" | sha256sum -c -
          unzip -q -o pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --verbose \
            --validate "Electry_artefacts/Release/VST3/Electry.vst3"

      - name: Package (Linux x64 tarball)
        run: python3 scripts/package-linux.py --build-dir build-plugin

      - name: Upload the distributable Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages-linux
          path: build-plugin/dist/Electry-*-build.*-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-plugindows:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Windows x64 (VST3, CLAP, standalone)
    runs-on: windows-2025
    steps:
      - name: Number this build
        shell: bash
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        # Embed the Release C++ runtime in every target, including dependencies.
        run: |
          cmake -S . -B build-plugin -A x64 -DELECTRY_BUILD_PLUGIN=ON -DELECTRY_BUILD_CLAP=ON -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build VST3, CLAP and standalone and run tests
        run: |
          cmake --build build-plugin --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-plugin -C Release --output-on-failure --no-tests=error

      - name: Validate the VST3 with pluginval
        working-directory: build-plugin
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          echo "${PLUGINVAL_WINDOWS_SHA256}  pluginval.zip" | sha256sum -c -
          7z x -y pluginval.zip
          ./pluginval.exe --strictness-level 10 --verbose \
            --validate "Electry_artefacts/Release/VST3/Electry.vst3"

      - name: Package (Windows x64 ZIP)
        run: python scripts/package-windows.py --build-dir build-plugin

      - name: Upload the distributable Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packages-win
          path: build-plugin/dist/Electry-*-build.*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  # Keep one complete package set on the workflow run. A mutable rolling GitHub
  # release is deliberately not used: repository release immutability protects
  # commercial tags and assets, while development builds remain short-lived.
  collect-packages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Collect packages, screenshot and audio demos
    needs: [build-macos, build-plugin, build-plugindows, refresh-audio-demos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-url: ${{ steps.upload-build.outputs.artifact-url }}
    steps:
      - name: Number this build
        shell: bash
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
      - name: Download every package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: distribution-packages-*
          merge-multiple: true
          path: dist

      - name: Check the four-file manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Deliberately expand this glob so the array contains every match.
          # shellcheck disable=SC2206
          mac_zips=(dist/Electry-*-macOS-universal.zip)
          if (( ${#mac_zips[@]} != 1 )); then
            echo "error: expected exactly one macOS zip, found ${#mac_zips[@]}" >&2
            printf '  %s\n' "${mac_zips[@]:-(none)}" >&2
            exit 1
          fi
          filename="${mac_zips[0]##*/}"
          version="${filename#Electry-}"
          version="${version%-build.${BUILD_NUMBER}-macOS-universal.zip}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "error: invalid version in $filename" >&2
            exit 1
          fi
          expected=(
            "dist/Electry-${version}-build.${BUILD_NUMBER}-macOS-universal.zip"
            "dist/Electry-${version}-build.${BUILD_NUMBER}-macOS-universal.pkg"
            "dist/Electry-${version}-build.${BUILD_NUMBER}-Linux-x64.tar.gz"
            "dist/Electry-${version}-build.${BUILD_NUMBER}-Windows-x64.zip"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "error: missing, empty, or version/build-mismatched asset: $asset" >&2
              exit 1
            fi
          done
          assets=(dist/*)
          if (( ${#assets[@]} != 4 )); then
            echo "error: expected exactly four release assets, found ${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]:-(none)}" >&2
            exit 1
          fi
          printf 'Release asset: %s\n' "${assets[@]}"

      - name: Download the rendered audio demos
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-build-audio
          path: rendered-audio

      - name: Unpack the audio demos and generated README
        run: |
          mkdir -p dist/media
          tar -xzf rendered-audio/audio-demos.tar.gz -C dist/media

      - name: Download the rendered screenshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-build-screenshot
          path: dist/media/Docs/screenshots

      - name: Record checksums, build number and source commit for the complete build
        working-directory: dist
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'build=%s\ncommit=%s\n' "$BUILD_NUMBER" "$SOURCE_COMMIT" > BUILD.txt
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS

      # Retained on the workflow run itself, downloadable by anyone with repo
      # access, as one complete cross-platform set.
      - name: Upload workflow artifact
        id: upload-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electry-main-build-${{ env.BUILD_NUMBER }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  # A single writer updates both media sets and the final download link only
  # after every product was built and the complete artifact was uploaded.
  # All generation happens in read-only jobs; only this publication job can push.
  refresh-generated-media:
    if: github.ref == 'refs/heads/main'
    name: Refresh screenshot, audio demos and README download link together
    needs: collect-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Number this build
        shell: bash
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the complete build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: electry-main-build-${{ env.BUILD_NUMBER }}
          path: completed-build

      - name: Verify the downloaded build
        working-directory: completed-build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(cat BUILD.txt)" = "$(printf 'build=%s\ncommit=%s' "$BUILD_NUMBER" "$SOURCE_COMMIT")"
          sha256sum --check SHA256SUMS

      - name: Commit media and final artifact link from this source version
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ needs.collect-packages.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python3 scripts/refresh-generated-media.py \
            --source-commit "$GITHUB_SHA" \
            --media-dir "$GITHUB_WORKSPACE/completed-build/media" \
            --build-number "$BUILD_NUMBER" \
            --artifact-url "$ARTIFACT_URL" \
            --remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --branch main
